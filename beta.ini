[beta]
; Cxbx-Reloaded beta feature toggles
; All features default to 1 (enabled). Set to 0 to disable.
; Place this file next to cxbxr-ldr.exe.

; --- Kernel features ---

; KiExecuteApc/KiInsertQueueApc: use try_lock instead of blocking lock.
; Prevents deadlock when a suspended thread holds the APC mutex.
apc_try_lock=0

; SatisfyWait: check APC pending flags instead of locking the APC mutex.
; Avoids deadlock in wait paths when try_lock is also enabled.
satisfy_wait_apc_flags=1

; KeWaitForSingleObject/KeWaitForMultipleObjects: re-check signal state
; after InsertTailList under WaitListLock to close a TOCTOU race.
wait_list_toctou_recheck=1

; KiClockIsr: use try_lock on timer mutex (skip tick if contended).
; Keeps clock updates fast but may skip timer expiry checks under contention.
timer_try_lock=1

; --- D3D / rendering features ---

; Render-target-to-texture aliasing for Xbox unified memory emulation.
; Maps RT surface addresses to host textures so post-processing effects work.
rt_texture_alias=1

; Bind a 1x1 transparent texture to unbound texture stages.
; Xbox NV2A returns (0,0,0,0) for unbound samplers; D3D9 returns (1,1,1,1) white.
default_transparent_tex=1

; StretchRect resolve when the current RT is also sampled as a texture.
; D3D9 forbids this; Xbox NV2A allows it via unified memory.
rt_resolve_self_sampling=1

; Upload only changed vertex shader constants per draw (delta upload).
; Reduces D3D9 API overhead. Disable for full upload every draw.
vsh_constant_delta_upload=1

; Reuse SYSTEMMEM staging surfaces across texture uploads.
; Avoids per-upload driver allocation (helps AMD). Disable to always allocate fresh.
staging_surface_pool=1

; Per-stage host texture binding cache. Skips redundant GetHostBaseTexture/SetTexture
; calls when the same texture is bound across consecutive draws.
texture_stage_cache=1

; Shared-memory draw probe used temporarily while isolating a corrupt draw.
; It is title-agnostic despite the historical option and mapping names.
or2_draw_probe=0

; Source multi-matrix fixed-function skinning transforms from the NV2A matrix
; palette. Disable to compare against the legacy HLE SetTransform mirror.
ff_nv2a_blend_matrices=1

; Rebuild the full fixed-function state before every draw. Diagnostic only.
ff_force_full_rebuild=0

; --- Timer / frame pacing ---

; Use high-resolution waitable timer in SleepPrecise for accurate frame pacing.
; Disable to fall back to plain Sleep() (less CPU, coarser timing).
precise_sleep_timer=1

; Periodically assert IRQ10 (~60Hz) to drive the Chihiro media board ISR/DPC chain.
; Required for games that wait on media board semaphores (Gundam BOS, etc.).
periodic_irq10=0

; Treat INT64_MIN (0x8000000000000000) timeout as immediate return.
; CRI library passes this value to KeDelayExecutionThread causing infinite hang.
llong_min_timeout_fix=1

; Spinlock in get_now() to prevent concurrent callers from double-counting
; elapsed time. Fixes distorted sound caused by exec_time jumps.
get_now_lock=1

; Use std::atomic for HalSystemInterrupt flags (m_Asserted, m_Pending, m_Enabled).
; Prevents lost/double-fired interrupts when system_events, MediaBoard I/O,
; and game ISR threads race on interrupt state.
atomic_interrupts=1

; Move system_events thread off the Xbox core to the "Other" CPU set.
; Reduces scheduling contention between the high-priority timer/interrupt thread
; and guest game threads that share the same core by default.
; 0=keep on Xbox core (default), 1=move to Other cores.
system_events_other_affinity=1

; Lower system_events thread priority from ABOVE_NORMAL to NORMAL.
; May reduce preemption of guest threads on the Xbox core at the cost of
; slightly less precise timer/interrupt delivery.
; 0=keep ABOVE_NORMAL (default), 1=use NORMAL priority.
system_events_normal_priority=1

; WMMT1/2 can busy-poll gamepad device changes while their render and timer
; workers initialize. Wine/Box32 benefits from a bounded yield; native desktop
; behavior remains unchanged unless explicitly enabled.
; 0=disabled (default), 1=recommended for Android/Wine.
wmmt_device_poll_yield_ms=0
; WMMT1/2 wait through 67,108,863 empty gamepad-change polls before starting
; JVS. Android enables this only for WMMT after CXBXR's normal USB-init delay.
wmmt_gamepad_init_bypass=0

; --- KiTimerExpiration safety guards ---

; Validate timer list pointers before dereferencing in KiTimerExpiration.
; Prevents crash on corrupt timer list entries (e.g. during BIOS→XBE transition).
; 1=enabled (default), 0=disabled (original behavior, may crash on corruption).
timer_exp_pointer_guard=1

; Max expired timers processed per KiTimerExpiration DPC call.
; 0=unlimited (default). Set to e.g. 1024 or 8192 to cap processing and prevent
; the timer lock from being held too long when many timers accumulate.
timer_exp_max_expired=0

; Max tick range processed per KiTimerExpiration DPC call.
; 0=use caller-provided range (default, already capped at 32 by KiClockIsr).
; Set to e.g. 8 or 16 to further limit per-call work.
timer_exp_max_ticks=0

; --- Crazy Taxi game-specific patches ---

; Report one transient gamepad-enumeration completion event so Crazy Taxi can
; leave its pre-JVS XGetDeviceChanges loop. Keep disabled for normal desktop.
ct_gamepad_init_bypass=0

; Skip Sofdec FMV playback (force movie status = "done").
; 1=skip movies, 0=normal CRI playback (default).
ct_skip_movies=0

; Service Crazy Taxi's Sofdec decoder through the CRI priority 2/4/5 callbacks
; while a movie starts or plays. Keep disabled until Android and Windows pass.
ct_cri_drive_movie_server=0

; Force CRI async I/O to complete instantly (set CompFlag=1 immediately).
; 1=instant-complete, 0=normal CRI I/O (default and required for movie/audio streaming).
ct_cri_force_complete=0

; Recover only the Crazy Taxi GM=7 CRI completion wait if its busy-spin remains
; stuck for this many milliseconds. 0 disables the recovery watchdog.
ct_cri_wait_timeout_ms=3000

; Hold Crazy Taxi's gameplay timer at a fixed value for renderer investigation.
; This is title-scoped and disabled by default for normal gameplay.
ct_infinite_timer=0
ct_timer_lock_value=3000
; Renderer diagnostic only. -1 restores the normal carousel.
ct_debug_course=-1
; Movie diagnostic only. Dumps selected post-conversion frames under C:\temp.
ct_debug_movie_dump=0
; Renderer diagnostic only. 99 restores the title's native sampler state.
ct_debug_mip_lod_bias=99
ct_debug_disable_lighting=0
; Crazy Taxi point-light diagnostics. 100 preserves the title's native state.
ct_debug_point_light_range_percent=100
ct_debug_point_light_attenuation_percent=100
ct_debug_stencil_volume_mode=0
ct_headlights=1
; --- Chihiro MediaBoard identity ---

; Media board type reported via LPC register 0x40F0.
; 0 = Type-1 (original, value 0x0000), 1 = Type-3 (newer, value 0x0001).
mb_board_type=0

; DIMM size reported via LPC register 0x40F4.
; 0 = 1GB (value 0x03), 1 = 512MB (value 0x02).
mb_dimm_size=0
mb_trace=0
